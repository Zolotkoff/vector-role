---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - name: Check vector binary exists
      ansible.builtin.stat:
        path: /usr/bin/vector
      register: vector_bin

    - name: Assert vector binary is present
      ansible.builtin.assert:
        that:
          - vector_bin.stat.exists
        fail_msg: "Vector binary not found"
        success_msg: "Vector binary is present"

    - name: Check vector config exists
      ansible.builtin.stat:
        path: /etc/vector/vector.yml
      register: vector_config

    - name: Assert vector config is present
      ansible.builtin.assert:
        that:
          - vector_config.stat.exists
        fail_msg: "Vector config not found"
        success_msg: "Vector config is present"

    - name: Validate vector config
      become: true
      ansible.builtin.command: vector validate --no-environment /etc/vector/vector.yml
      register: vector_validate
      changed_when: false
      failed_when: vector_validate.rc != 0
